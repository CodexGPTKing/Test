name: Temporary TikTok ZTSb5emh7 extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-tiktok-ztsb5emh7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install subtitle tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp openai-whisper

      - name: Recover native captions and separate audio
        env:
          INPUT_URL: https://www.tiktok.com/t/ZTSb5emh7/
        run: |
          set -u
          mkdir -p output diagnostics
          curl -A 'Mozilla/5.0' -sSL -o diagnostics/tiktok_page.html -w '%{url_effective}\n' "$INPUT_URL" > diagnostics/resolved_url.txt 2>&1 || true
          EFFECTIVE_URL="$(tail -n 1 diagnostics/resolved_url.txt 2>/dev/null || true)"
          case "$EFFECTIVE_URL" in http*) ;; *) EFFECTIVE_URL="$INPUT_URL" ;; esac
          echo "$EFFECTIVE_URL" > diagnostics/effective_url.txt

          curl -A 'Mozilla/5.0' -sS -G 'https://www.tikwm.com/api/' \
            --data-urlencode "url=$INPUT_URL" --data 'hd=1' -o diagnostics/tikwm.json || true
          yt-dlp --skip-download --write-subs --write-auto-subs --sub-langs all --sub-format 'srt/vtt/best' \
            --output 'output/video.%(ext)s' "$EFFECTIVE_URL" > diagnostics/ytdlp_captions.log 2>&1 || true

          AUDIO_URL="$(jq -r '.data.music_info.play // empty' diagnostics/tikwm.json 2>/dev/null | head -n1)"
          if [ -n "$AUDIO_URL" ]; then
            curl -A 'Mozilla/5.0' -L --fail --retry 3 --retry-all-errors -o output/audio-source.mp3 "$AUDIO_URL" \
              > diagnostics/audio_download.log 2>&1 || true
          fi
          if [ -s output/audio-source.mp3 ]; then
            ffmpeg -y -i output/audio-source.mp3 -ac 1 -ar 16000 output/audio.wav \
              > diagnostics/ffmpeg_audio.log 2>&1 || true
          fi
          find output diagnostics -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort > diagnostics/files-before-transcription.txt
          true

      - name: Transcribe with Whisper small.en
        if: always()
        run: |
          set -u
          if [ -s output/audio.wav ]; then
            whisper output/audio.wav --model small.en --language en --task transcribe \
              --output_dir output --output_format all --word_timestamps True --fp16 False \
              > diagnostics/whisper-small-en.log 2>&1 || true
          else
            echo 'No audio recovered' > diagnostics/whisper-small-en.log
          fi
          find output diagnostics -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort > diagnostics/files-final.txt
          cat diagnostics/files-final.txt

      - name: Upload full artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ztsb5emh7-small-en
          path: |
            output/**
            diagnostics/**
          if-no-files-found: warn
          retention-days: 1
